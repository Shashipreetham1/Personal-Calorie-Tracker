# Every variable below has a default, so `docker compose up` works with no .env
# file. Compose automatically reads ./.env if present, which is how a real
# GEMINI_API_KEY or a different Postgres password gets in.

services:
  db:
    image: postgres:16-alpine
    container_name: ct_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calorie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calorie}
      POSTGRES_DB: ${POSTGRES_DB:-calorie_tracker}
    ports:
      # Exposed so psql / a GUI client on the host can inspect the schema.
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The backend waits for this: Postgres accepts connections only after
      # initdb finishes, and migrations on boot would otherwise race it.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-calorie} -d ${POSTGRES_DB:-calorie_tracker}']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: ct_server
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-calorie}:${POSTGRES_PASSWORD:-calorie}@db:5432/${POSTGRES_DB:-calorie_tracker}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-please-32}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_NAME: ${COOKIE_NAME:-ct_token}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
    ports:
      - '4000:4000'
    volumes:
      # Only `src` is bind-mounted, so edits reload live while node_modules
      # stays the image's own. Adding a dependency = `docker compose up --build`.
      - ./server/src:/app/src
    command: npm run dev

  web:
    build: ./web
    container_name: ct_web
    depends_on:
      - server
    environment:
      # Baked into the bundle at dev-server start; the browser (not the
      # container) resolves it, so this is localhost, not `server`.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - '5173:5173'
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html

volumes:
  pgdata:
